[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sys42"
version = "0.1.0"
description = "sys42 — startup g'oyasidan tayyor texnik topshiriqqacha, terminaldan"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Bog'liqliklar SHU YERDA e'lon qilinadi — `pip install sys42` ularni o'zi
# tortib keladi. Ularni dastur ichida `subprocess.run(["pip", "install", ...])`
# bilan o'rnatish keng tarqalgan xato: birinchi ishga tushirish sekin bo'ladi,
# virtual muhitdan tashqariga yozib yuborishi mumkin, internetsiz ishlamaydi
# va o'rnatish muvaffaqiyatsiz tugasa dastur yarim yo'lda qoladi.
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
# Terminalda `sys42` deb yozilganda shu funksiya ishga tushadi. `cli` emas,
# `main` — o'rtada Ctrl+C ni tutib, izsiz chiqish uchun o'ram bor.
sys42 = "sys42_cli.main:main"

[tool.setuptools.packages.find]
include = ["sys42_cli*"]
